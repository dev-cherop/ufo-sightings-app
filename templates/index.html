<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🛸 Cheros UFO Appearance Prediction 👽</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
  <div class="grid">
    <div class="box">
      <h1>UFO Country Predictor</h1>
      <p>Based on the duration (seconds), latitude, and longitude, predict which country is most likely to report a UFO sighting.</p>

      <form action="{{ url_for('predict') }}" method="post">
        <input type="number" name="seconds" placeholder="Seconds (0–60)" required min="0" max="60" step="any" />
        <br><br>
        <input type="text" name="latitude" placeholder="Latitude (-90 to 90)" required />
        <br><br>
        <input type="text" name="longitude" placeholder="Longitude (-180 to 180)" required />
        <br><br>
        <button type="submit" class="btn">🔮 Predict Country</button>
      </form>

      {% if prediction_text %}
        <p class="result">{{ prediction_text }}</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
